<!--structure of HTML-->
<!DOCTYPE html>              <!--it will tell the browser that it is a HTML type document-->
<html>                       <!--html is a root element-->
    <head>                   <!--head tag will provide the title and  meta information(meta tags will contain description about the website)-->
        <title>HTML DOCUMENT</title>     <!--title/name of the website-->
    </head>
    <body>                   <!--body tag contains all the information about the website-->
        <!--comment in HTML-->
        <h1>Hello World</h1>
    </body>
</html>
