<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Media=picture,audio,video-->
    <!-- to maintain aspect ratio we either have width or height but not both -->
    <!-- alt-used to display any alternate message if there is failure to generate image -->
    <h1>IMAGE</h1>
    <img src="media/pics/lion-3317670_1280.jpg" alt="error" height="300px">
    <img src="media/pics/lion-4712141_1280.jpg" alt="error" height="300px">
    <img src="media/pics/lion-6255523_1280.jpg" alt="error" height="300px">
    <h1>VIDEO</h1>
    <video src="media/videos/855625-hd_1920_1080_25fps.mp4" width="480px" controls autoplay muted loop></video>
    <!-- controls-to play the video,autoplay-to autoplay it without clicking ,muted-to mute,loop-to keep playing -->
    <video src="media/videos/855633-hd_1920_1080_25fps.mp4" width="480px" controls></video>
</body>
</html>
