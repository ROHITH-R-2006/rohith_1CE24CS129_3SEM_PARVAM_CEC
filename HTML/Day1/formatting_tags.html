<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMATTING</title>
</head>
<body>
    <h>FORMAT</h>
    <!--Text formatting tags-->
    <p>this is a <b>important/bold</b> text</p>
    <p>this is a <i>italic</i> text</p>
    <p>this is a <u>underlined</u> text</p>
    <p>iam <i>ROHITH.R</i>studying in <b>City Engineering College.</b>iam passionate about<u>coding,cricket,badminton.</u></p>
    <!--ctrl ? -shortcut for comment-->
    <!-- sub tag-subscript -->
    <p>water :H<sub>2</sub>O</p>
    <p>carbon di oxide:CO<sub>2</sub></p>
    <!-- sup tag-superscript -->
    <p>2<sup>3</sup>:8</p>
    <p>3<sup>2</sup>:9</p>
    <p>On 1<sup>st</sup>September we learned how to creaye a website</p>
</body>
</html>
