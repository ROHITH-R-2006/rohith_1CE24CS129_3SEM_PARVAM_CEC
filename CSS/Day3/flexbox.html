<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div.child{
    width:250px;
    height:200px;
    background-color: rgb(11, 11, 11);
    border:3px solid rgb(234, 223, 16);
    color: rgb(228, 12, 12);
    font-size: 30px;
    font-weight: bold;
    text-align: center;
}
/* Flex box */
.parent{
    display:flex;
    /* horizontal axis - justify content */
    /* start,center,end,space-between,space-around,space-evenly */
    justify-content:space-evenly;
    /* vertical axis - align content */
    /* start,center,end,space-between,space-around,space-evenly */
    flex-direction: row-reverse;
    /*flex direction:row reverse(default),coloumn reverse*/
    align-items: center;
    border:1px solid black;
    height: 500px;
    flex-wrap:wrap;
    gap: 20px; /*for additional space*/
    /*to use align content first we have to wrap properly*/
    align-content:space-evenly;
    /* align content > wrap */
}
    </style>
</head>
<body>
    <div class="parent">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
        <div class="child">4</div>
        <div class="child">5</div>
        <div class="child">6</div>
        <div class="child">7</div>
        <div class="child">8</div>
        <div class="child">9</div>
        <div class="child">10</div>
    </div>
</body>
</html>
