<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            color:green;
            padding:20px;
            border-style:groove;
            border-width:20px;
            border-color:red;
            border-bottom: 30px ridge purple;
            border-top: 10px solid green;
            border-left: 5px dotted violet;
            border-right: 30px dashed yellow;
        }
        .align-center{
            text-align:center;
        }
        .sub{
            color:brown;
        }
        .class{
            border:20px dashed yellowgreen;
            width:fit-content;
        }
        .box{
            
            border-width:100px;
            border:20px solid yellow;
            border-radius:50px;
            border-top-left-radius: 50px;
            border-bottom-right-radius:80 ;
            border-bottom-left-radius:50 ;
            border-top-right-radius:40 ;
            width:fit-content;
        }
        .circle{
            background-color: purple;
            border:5px solid yellowgreen;
            border-radius: 100px;
            width:fit-content;
        }
        .squircle{
            background-color: violet;
            border:5px dashed goldenrod;
            border-radius: 50px;
            width:fit-content;
        }
    </style>
</head>
<body>
    <h1 class="main align-center">City Engineering College</h1>
    <h3 class="sub align-center">Computer Science And Engineering</h3>
    <h3 class="class">Sem3</h3>
    <h3 class="box">ROHITH.R</h3>
    <h3 class="circle">Circle</h3>
    <h3 class="squircle">squircle</h3>
</body>
</html>
<!-- borders:
 1)border-width:size of the border
 2)border-style:solid,dashed,double,dotted,groove,ridge
 3)border-color:color of the border -->
